# ═══════════════════════════════════════════════════════════════
# Nginx Configuration for schools.clarvo.in
# Proxies to Next.js Docker Container on host port 3005
# ═══════════════════════════════════════════════════════════════

# Upstream Next.js Docker container (mapped to host port 3005)
upstream clarvo_schools_app {
    server 127.0.0.1:3005;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name schools.clarvo.in;

    # Maximum upload size
    client_max_body_size 25M;

    # Gzip compression for high performance
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets cache optimization (_next/static)
    location /_next/static {
        proxy_pass http://clarvo_schools_app;
        proxy_cache_valid 200 365d;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static images & favicons
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2)$ {
        proxy_pass http://clarvo_schools_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # All dynamic routes and Next.js server actions
    location / {
        proxy_pass http://clarvo_schools_app;
        proxy_http_version 1.1;

        # WebSocket support (HMR, real-time events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward host and real client IP headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }
}
