<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='1024' height='1024'>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#3B82F6'/>
      <stop offset='50%' stop-color='#2563EB'/>
      <stop offset='100%' stop-color='#1D4ED8'/>
    </linearGradient>
    
    <!-- Subtle Inner Gloss -->
    <linearGradient id='gloss' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#FFFFFF' stop-opacity='0.25'/>
      <stop offset='30%' stop-color='#FFFFFF' stop-opacity='0.05'/>
      <stop offset='100%' stop-color='#000000' stop-opacity='0.15'/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id='dropShadow' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='12' stdDeviation='16' flood-color='#0B2E6B' flood-opacity='0.35'/>
    </filter>
  </defs>

  <!-- Blue Squircle Base -->
  <rect x='32' y='32' width='448' height='448' rx='112' ry='112' fill='url(#bgGrad)' filter='url(#dropShadow)'/>
  <rect x='32' y='32' width='448' height='448' rx='112' ry='112' fill='url(#gloss)'/>
  <rect x='33' y='33' width='446' height='446' rx='111' ry='111' fill='none' stroke='#FFFFFF' stroke-width='3' stroke-opacity='0.2'/>

  <!-- Graduation Cap (Mortarboard) -->
  <g transform='translate(0, 5)'>
    <!-- Cap Top Diamond -->
    <polygon points='256,120 400,165 256,210 112,165' fill='#FFFFFF'/>
    <polygon points='256,120 400,165 256,210 112,165' fill='none' stroke='#FFFFFF' stroke-width='6' stroke-linejoin='round'/>

    <!-- Cap Skull Base / Underband -->
    <path d='M172,185 L172,216 Q256,242 340,216 L340,185' fill='none' stroke='#FFFFFF' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/>
    <path d='M172,185 L172,216 Q256,242 340,216 L340,185' fill='#FFFFFF' opacity='0.9'/>

    <!-- Tassel String and Knob -->
    <circle cx='256' cy='165' r='7' fill='#1D4ED8'/>
    <circle cx='256' cy='165' r='5' fill='#FFFFFF'/>
    <path d='M256,165 Q330,172 360,225' fill='none' stroke='#FFFFFF' stroke-width='5' stroke-linecap='round'/>
    
    <!-- Tassel Bulb/Fringe -->
    <ellipse cx='360' cy='230' rx='7' ry='12' fill='#FFFFFF'/>
    <path d='M354,238 L366,238 L364,258 L356,258 Z' fill='#FFFFFF'/>
  </g>

  <!-- Collegiate Varsity Letter C -->
  <g transform='translate(0, 15)'>
    <path d='
      M 340, 235
      L 205, 235
      Q 165, 235 165, 275
      L 165, 385
      Q 165, 425 205, 425
      L 340, 425
      L 340, 375
      L 215, 375
      L 215, 285
      L 340, 285
      L 340, 235
      Z
    ' fill='#FFFFFF'/>
  </g>
</svg>
